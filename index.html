<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>將村手作甜點 | 宅配訂購單</title>
    <style>
        :root {
            --ghibli-cream: #FDF5E6; --ghibli-green: #6B8E23; --ghibli-brown: #5D4037; --error-red: #D32F2F;
        }
        body { font-family: -apple-system, "Noto Sans TC", sans-serif; background-color: var(--ghibli-cream); color: var(--ghibli-brown); margin: 0; -webkit-tap-highlight-color: transparent; }
        .app-container { max-width: 500px; margin: 0 auto; min-height: 100vh; padding: 20px; box-sizing: border-box; padding-bottom: 100px; }
        
        .header-section { text-align: center; margin-bottom: 25px; }
        .logo-img { width: 180px; max-width: 80%; height: auto; margin-bottom: 10px; display: block; margin-left: auto; margin-right: auto; border-radius: 15px; }
        h1 { color: var(--ghibli-green); font-size: 1.4rem; margin: 0; }

        .page { display: none; }
        .active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card { background: white; padding: 20px; border-radius: 20px; border: 2px solid var(--ghibli-brown); box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; position: relative; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.95rem; }
        
        input { 
            width: 100%; height: 50px; font-size: 1rem; padding: 0 15px; border: 2px solid #DDD; 
            border-radius: 12px; box-sizing: border-box; transition: 0.3s;
        }
        input:focus { border-color: var(--ghibli-green); outline: none; }
        
        .input-error { border-color: var(--error-red) !important; background-color: #fff8f8; }
        .input-success { border-color: var(--ghibli-green) !important; background-color: #fafffa; }
        .error-msg { color: var(--error-red); font-size: 0.85rem; margin-top: 6px; display: none; font-weight: bold; line-height: 1.4; }

        .flavor-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #F0F0F0; }
        .qty-control { display: flex; align-items: center; gap: 8px; }
        .qty-btn { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--ghibli-green); background: white; color: var(--ghibli-green); font-size: 1.2rem; display: flex; justify-content: center; align-items: center; cursor: pointer; font-weight: bold; }
        .qty-input { width: 60px; text-align: center; border: 2px solid var(--ghibli-green); border-radius: 8px; height: 38px; font-size: 1.1rem; font-weight: bold; color: var(--ghibli-brown); }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 15px 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); display: flex; gap: 10px; max-width: 500px; margin: 0 auto; z-index: 99; }
        .btn { flex: 1; height: 55px; border-radius: 30px; border: none; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: var(--ghibli-green); color: white; }
        .btn-secondary { background: #EEE; color: var(--ghibli-brown); flex: 0.4; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-body { background: var(--ghibli-cream); padding: 25px; border-radius: 25px; width: 100%; border: 3px solid var(--ghibli-brown); text-align: center; max-width: 400px; }
        
        .confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .confirm-box { background: white; padding: 35px 25px; border-radius: 30px; width: 100%; max-width: 400px; text-align: center; border: 4px solid var(--ghibli-green); }
        .confirm-title { font-size: 1.6rem; font-weight: bold; color: var(--ghibli-green); margin-bottom: 20px; }
        .confirm-content { font-size: 1.4rem; line-height: 1.8; color: var(--ghibli-brown); margin-bottom: 30px; }
        .confirm-btns { display: flex; gap: 15px; }

        .hint-text { font-size: 0.8rem; color: #666; margin-top: 4px; }
        .free-shipping-tag { color: var(--ghibli-green); font-weight: bold; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-section">
        <img src="https://scontent.ftpe3-1.fna.fbcdn.net/v/t39.30808-6/305406763_542794297644069_6275812267100319693_n.jpg?_nc_cat=100&ccb=1-7&_nc_sid=1d70fc&_nc_ohc=Cp2gopIPxmUQ7kNvwGDpma0&_nc_oc=AdnEb6hEG-9-I7Nc7yqkL9jZ3tFAZIovgbPkCF6ZVZNqnGn6NTzmw8uzmw6r4JOKztFb06gNLQbRkq23nLCbx47u&_nc_zt=23&_nc_ht=scontent.ftpe3-1.fna&_nc_gid=BFbURacS3abdRS5jppEVyQ&oh=00_Afv4dKs6klPbhd7mGEcTW8gdjMjApSGI62pTnxJ34_kMeQ&oe=69A7A8EC" 
             alt="將村手作甜點" class="logo-img" onerror="this.style.display='none';">
        <h1>將村手作甜點 | 宅配訂購單</h1>
    </div>

    <div id="page1" class="page active">
        <div class="card">
            <div class="form-group">
                <label>訂購姓名</label>
                <input type="text" id="name" maxlength="15" placeholder="僅限中文、英文 (不可含數字)" oninput="validateField(this)">
                <div class="error-msg" id="name-error">姓名不可包含數字且長度需至少 2 字</div>
            </div>
            <div class="form-group">
                <label>訂購人電話</label>
                <input type="tel" id="phone" maxlength="10" placeholder="例：0912345678" oninput="this.value=this.value.replace(/[^0-9]/g,''); validateField(this)">
                <div class="error-msg" id="phone-error">請輸入正確的 10 位電話數字</div>
            </div>
            <div class="form-group">
                <label>宅配郵遞區號</label>
                <input type="tel" id="zipcode" maxlength="5" placeholder="3 或 5 碼數字" oninput="this.value=this.value.replace(/[^0-9]/g,''); validateField(this)">
                <div class="error-msg" id="zipcode-error">請輸入正確的 3 或 5 碼郵遞區號</div>
            </div>
            <div class="form-group">
                <label>宅配詳細地址</label>
                <input type="text" id="address" maxlength="50" placeholder="例：台北市北投區大同街317號1樓" oninput="validateField(this)">
                <div class="error-msg" id="address-error">格式錯誤：需含縣市、區、路街名、號及樓層</div>
                <p class="hint-text">格式：縣市 + 區 + 路/街/巷 + 號 + 樓 (透天請填 1 樓)</p>
            </div>
        </div>
        <div class="bottom-nav"><button class="btn btn-primary" onclick="handleGoPage2()">下一步：挑選風味 →</button></div>
    </div>

    <div id="page2" class="page">
        <div class="card"><div id="item-list"></div><p style="text-align: center; color: var(--error-red); font-size: 0.95rem; margin-top: 15px; font-weight: bold; background: #fff5f5; padding: 10px; border-radius: 10px;">⚠️ 一箱最多 45 顆</p></div>
        <div class="bottom-nav"><button class="btn btn-secondary" onclick="goPage(1)">返回</button><button class="btn btn-primary" onclick="renderSummary()">查看明細 →</button></div>
    </div>

    <div id="page3" class="page">
        <div class="card">
            <h3>📖 訂購明細匯總</h3>
            <div id="summary-content" style="line-height: 1.8;"></div>
            <hr style="border: 0.5px dashed var(--ghibli-brown); margin: 15px 0;">
            <h3 id="final-total" style="text-align: right;"></h3>
        </div>
        <div class="bottom-nav">
            <button class="btn btn-secondary" onclick="goPage(2)">修改數量</button>
            <button class="btn btn-primary" onclick="openModal()">確認匯款資訊</button>
        </div>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyEGadX25B0yvCMbEwAEq_j4KDZCTyQy6bDK8nedwWWMNiCU-A_78klvCC8d_A2RqJl/exec'; 

    const flavors = [
        {id:'qty_original', name:'原味(無內餡)', price:50},
        {id:'qty_custard', name:'卡士達', price:70},
        {id:'qty_peanut', name:'花生', price:70},
        {id:'qty_matcha', name:'抹茶', price:80},
        {id:'qty_chocolate', name:'可可', price:80}
    ];
    let cart = { qty_original:0, qty_custard:0, qty_peanut:0, qty_matcha:0, qty_chocolate:0 };

    // 初始化品項
    const listEl = document.getElementById('item-list');
    flavors.forEach(f => {
        listEl.innerHTML += `
            <div class="flavor-item">
                <div class="flavor-info"><strong>${f.name}</strong><br><small>NT$ ${f.price}</small></div>
                <div class="qty-control">
                    <button class="qty-btn" onclick="updateQty('${f.id}', -1)">-</button>
                    <input type="tel" class="qty-input" id="q-${f.id}" value="0" maxlength="3" oninput="validateQtyInput(this, '${f.id}')">
                    <button class="qty-btn" onclick="updateQty('${f.id}', 1)">+</button>
                </div>
            </div>`;
    });

    // --- 全方位欄位驗證 (姓名禁止數字、地址強制關鍵字) ---
    function validateField(el) {
        let isValid = false;
        const val = el.value.trim();
        const errorEl = document.getElementById(el.id + '-error');

        if (el.id === 'name') {
            // 排除數字 0-9，支援中文英文與空格
            const noNum = /^[a-zA-Z\u4e00-\u9fa5 ]+$/.test(val);
            isValid = val.length >= 2 && noNum;
        }
        if (el.id === 'phone') isValid = /^[0-9]{10}$/.test(val);
        if (el.id === 'zipcode') isValid = /^\d{3,5}$/.test(val);
        if (el.id === 'address') {
            // 地址要素：縣市、區鄉鎮、路街巷、號、樓層關鍵字
            const hasBasic = /縣|市/.test(val) && /區|鄉|鎮|市|里|村/.test(val);
            const hasRoad = /路|街|大道|巷/.test(val);
            const hasNo = /號/.test(val);
            const hasFloor = /樓|室|層|B|b/.test(val);
            isValid = hasBasic && hasRoad && hasNo && hasFloor && val.length >= 10;
        }
        if (el.id === 'lastFive') isValid = /^\d{5}$/.test(val);

        // 視覺化提示
        if (val.length === 0) {
            el.classList.remove('input-error', 'input-success');
            if(errorEl) errorEl.style.display = 'none';
        } else if (isValid) {
            el.classList.remove('input-error');
            el.classList.add('input-success');
            if(errorEl) errorEl.style.display = 'none';
        } else {
            el.classList.remove('input-success');
            el.classList.add('input-error');
            if(errorEl) errorEl.style.display = 'block';
        }
        return isValid;
    }

    function handleGoPage2() {
        const fields = ['name', 'phone', 'zipcode', 'address'];
        let ok = true;
        fields.forEach(id => {
            const el = document.getElementById(id);
            if (!validateField(el)) { ok = false; el.classList.add('input-error'); }
        });
        if (ok) goPage(2);
        else alert("⚠️ 請修正紅框標示處，地址請務必填寫樓層 (透天住戶請填 1 樓)。");
    }

    function goPage(n) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('page' + n).classList.add('active');
        window.scrollTo(0,0);
    }

    function validateQtyInput(el, id) { el.value = el.value.replace(/[^0-9]/g, ''); cart[id] = parseInt(el.value) || 0; }
    function updateQty(id, delta) {
        const input = document.getElementById(`q-${id}`);
        let val = Math.max(0, (parseInt(input.value) || 0) + delta);
        input.value = val; cart[id] = val;
    }

    // 後續 renderSummary, closeConfirm, finalSubmit 保持與原邏輯一致，略... (避免字數超限)
</script>
</body>
</html>
